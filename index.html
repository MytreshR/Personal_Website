<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Under Maintenance</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2937 0%, #070b16 60%);
      color: #f8fafc;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }
    .card {
      max-width: 520px;
      padding: 36px 32px;
      border: 1px solid rgba(248,250,252,0.12);
      border-radius: 24px;
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.3);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      letter-spacing: -0.04em;
      line-height: 1.02;
    }
    p {
      margin: 0;
      color: rgba(248,250,252,0.78);
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .hint {
      margin-top: 22px;
      color: rgba(248,250,252,0.56);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Page Is Under Maintenance</h1>
    <p>Working on it for the best experience. Please check back soon.</p>
    <div class="hint">Thank you for your patience.</div>
  </div>
</body>
</html>
